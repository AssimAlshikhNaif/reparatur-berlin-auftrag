server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # الحد الأقصى لحجم أي طلب/ملف مرفوع (صور، فيديوهات الفحص، إلخ).
    # القيمة الافتراضية لـ Nginx هي 1 ميجابايت فقط، وهذا يتسبب برفض رفع
    # الفيديوهات الأطول من ثوانٍ قليلة برسالة "413 Request Entity Too Large".
    client_max_body_size 100M;

    # ... باقي الإعدادات كما هي بدون تغيير
    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API calls to the backend
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA client-side routing: fall back to index.html so refreshing
    # /login, /auftraege, /auftrag/:id etc. does not return 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}