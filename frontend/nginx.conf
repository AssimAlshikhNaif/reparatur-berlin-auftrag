server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache static assets (React JS, CSS, and general UI assets)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 1. Forward all API calls to backend
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200M;
    }

    # 2. Handle files under /api/files/ with nested subdirectories
    location ~* ^/api/files/ {
        rewrite ^/api/files/(?:.*/)?([^/]+\.(?:jpg|jpeg|png|gif|webp|heic|heif|webm|mp4|mov|pdf))$ /api/files/$1 break;
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Handle raw image requests (excluding frontend static assets like logo)
    location ~* ^/(?!assets/|static/|favicon\.ico|logo).*\.(jpg|jpeg|png|gif|webp|heic|heif|webm|mp4|mov|pdf)$ {
        rewrite ^.*/([^/]+\.(?:jpg|jpeg|png|gif|webp|heic|heif|webm|mp4|mov|pdf))$ /api/files/$1 break;
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. SPA fallback (Allows React to handle routing and local static assets like logo.png)
    location / {
        try_files $uri $uri/ /index.html;
    }
    # 5. Handle uploads directory proxying to backend
    location /uploads/ {
        proxy_pass http://backend:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}